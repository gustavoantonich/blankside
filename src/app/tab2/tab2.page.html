<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Galería</ion-title>
    <ion-buttons slot="end">
      <ion-button
        title="Tomar foto con la cámara"
        [disabled]="guardando()"
        (click)="tomarFoto()"
      >
        <ion-icon slot="icon-only" name="camera"></ion-icon>
      </ion-button>
      <ion-button
        title="Agregar imagen desde un directorio"
        [disabled]="guardando()"
        (click)="agregarDesdeDirectorio()"
      >
        <ion-icon slot="icon-only" name="images"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="cargando" *ngIf="cargando()">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando galería...</p>
  </div>

  <ion-grid class="galeria" *ngIf="!cargando() && fotos().length > 0">
    <ion-row>
      <ion-col size="6" *ngFor="let foto of fotos(); trackBy: trackByFoto">
        <div class="foto-item">
          <img [src]="foto.displayUrl" [alt]="foto.nombre" loading="lazy" />

          <ion-button
            class="borrar"
            color="danger"
            size="small"
            fill="clear"
            title="Borrar foto"
            (click)="borrarFoto(foto)"
          >
            <ion-icon slot="icon-only" name="trash"></ion-icon>
          </ion-button>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>

  <div class="vacio" *ngIf="!cargando() && fotos().length === 0">
    <ion-icon name="images"></ion-icon>
    <h2>No hay fotos todavía</h2>
    <p>Usa la cámara o agrega una imagen desde un directorio.</p>
  </div>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button [disabled]="guardando()" (click)="tomarFoto()">
      <ion-icon name="camera"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Galería</ion-title>
    </ion-toolbar>
  </ion-header>
</ion-content>
